{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "picpay-app.serviceAccountName" . }}
  labels:
    {{- include "picpay-app.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# A app não acessa a AWS; a SA é só para identidade/isolamento no cluster.
automountServiceAccountToken: false
{{- end }}
