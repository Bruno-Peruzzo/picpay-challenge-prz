{{- if .Values.pdb.enabled -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "picpay-app.fullname" . }}
  labels:
    {{- include "picpay-app.labels" . | nindent 4 }}
spec:
  # Mantém ao menos minAvailable pods durante disrupções voluntárias
  # (drain de nó, upgrade). Protege a disponibilidade sem impedir manutenção.
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "picpay-app.selectorLabels" . | nindent 6 }}
{{- end }}
