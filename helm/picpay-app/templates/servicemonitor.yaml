{{- if .Values.serviceMonitor.enabled -}}
# Requer o CRD ServiceMonitor (instalado pelo kube-prometheus-stack, Fase 4).
# O Prometheus do stack seleciona ServiceMonitors por label; por isso é comum
# precisar de additionalLabels (ex.: release: <release-do-stack>) para o scrape
# ser descoberto.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "picpay-app.fullname" . }}
  labels:
    {{- include "picpay-app.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "picpay-app.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
